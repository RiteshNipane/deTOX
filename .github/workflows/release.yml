name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew testDebugUnitTest

      # One-time setup: base64 -w0 release.jks > keystore.b64, store it as the secret DETOX_KEYSTORE_B64,
      # plus DETOX_KEYSTORE_PASSWORD, DETOX_KEY_ALIAS, DETOX_KEY_PASSWORD. KEEP A BACKUP OF THE KEYSTORE:
      # if you lose it you cannot ship updates to people who installed an earlier APK.
      - name: Decode keystore
        run: echo "${{ secrets.DETOX_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          DETOX_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          DETOX_KEYSTORE_PASSWORD: ${{ secrets.DETOX_KEYSTORE_PASSWORD }}
          DETOX_KEY_ALIAS: ${{ secrets.DETOX_KEY_ALIAS }}
          DETOX_KEY_PASSWORD: ${{ secrets.DETOX_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "deTOX-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: deTOX-*.apk
          generate_release_notes: true
